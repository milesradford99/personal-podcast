name: 试 Qwen3-TTS（CPU）

on:
  push:
    branches: [main]
    paths: ["samples/qwen/**", ".github/workflows/qwen-test.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖（CPU 版 torch）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg sox
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q qwen-tts edge-tts mutagen
          nproc; free -g
      - name: 0.6B：面试官 Serena，候选人 Uncle_Fu
        run: python samples/qwen/qwen_test.py Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice Serena Uncle_Fu qwen-0.6b-serena-unclefu
      - name: 1.7B：面试官 Serena，候选人 Uncle_Fu，带语气指令
        run: python samples/qwen/qwen_test.py Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice Serena Uncle_Fu qwen-1.7b-serena-unclefu "像真实技术面试里的口语对话，自然、放松，有停顿和语气起伏"
      - name: 1.7B：面试官 Vivian，候选人 Dylan，带语气指令
        run: python samples/qwen/qwen_test.py Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice Vivian Dylan qwen-1.7b-vivian-dylan "像真实技术面试里的口语对话，自然、放松，有停顿和语气起伏"
      - name: 上传
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat out/stats.txt || true
          gh release delete qwen-samples --yes --cleanup-tag 2>/dev/null || true
          gh release create qwen-samples out/* --title "Qwen3-TTS 试听" --notes "$(cat out/stats.txt)" --prerelease
