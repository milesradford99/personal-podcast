name: 渲染并发布新集

on:
  push:
    branches: [main]
    paths: ["episodes/**", "podcast.json", "tools/**", ".github/workflows/publish.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts mutagen "kaggle>=1.8.0" six
      - name: Qwen3-TTS：在 Kaggle GPU 上合成（podcast.json 的 engine 为 qwen 时）
        run: |
          if [ "$(python -c 'import json;print(json.load(open("podcast.json")).get("engine","edge"))')" = "qwen" ]; then
            python tools/kaggle_job.py
          fi
      - name: 渲染并上传
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/render.py --publish
      - name: 提交 RSS 和播放器数据
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "发布新集 [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
